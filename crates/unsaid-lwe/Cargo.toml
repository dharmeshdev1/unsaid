[package]
name = "unsaid-lwe"
description = "Learning-with-errors primitives for private retrieval: fresh-secret linear encryption, hint preprocessing, and a noise budget you can check at build time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
zeroize.workspace = true
getrandom.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
rand_chacha = "0.3"
rand_core = "0.6"

[lints]
workspace = true
