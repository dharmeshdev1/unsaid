name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --workspace --release

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    name: WebAssembly client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release -p unsaid-wasm --target wasm32-unknown-unknown

  interop:
    name: Python client against the Rust server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: cargo build --release -p unsaid
      - name: Search through an independent client
        run: |
          ./target/release/unsaid demo --port 8377 &
          for attempt in $(seq 1 150); do
            curl -fs http://127.0.0.1:8377/v1/health && break
            sleep 2
          done
          python tutorial/3_real_client.py "how do vaccines work" --unsaid ./target/release/unsaid
          ./target/release/unsaid search "how do vaccines work" --trace

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t unsaid .
      - run: docker run --rm unsaid unsaid --version

  tutorial:
    name: Tutorial runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python tutorial/1_lwe_by_hand.py
      - run: python tutorial/2_pir_from_scratch.py
      - run: python tools/lwe_estimate.py
