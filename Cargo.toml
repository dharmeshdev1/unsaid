[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Dharmesh Meena"]
repository = "https://github.com/dharmeshdev1/unsaid"
homepage = "https://github.com/dharmeshdev1/unsaid"

[workspace.dependencies]
unsaid-lwe = { path = "crates/unsaid-lwe", version = "0.1.0" }
unsaid-embed = { path = "crates/unsaid-embed", version = "0.1.0" }
unsaid-core = { path = "crates/unsaid-core", version = "0.1.0" }
unsaid-build = { path = "crates/unsaid-build", version = "0.1.0" }
unsaid-server = { path = "crates/unsaid-server", version = "0.1.0" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zeroize = "1"
getrandom = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Tests exercise the same arithmetic the release build runs, and some of them are heavy.
[profile.test]
opt-level = 2
